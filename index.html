    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Mizan</title>
    </head>
    <body>
        <header>
            <h1>Mizan</h1>
            <p>Suivez les prix de l'or et de l'argent en temps réel</p>
        </header>
        <main>

            <select id = "currency-select"> 
                <option value="MAD">MAD</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>

            <section class="prices-container" id="prices-container">
            <p>Chargement des prix...</p>
             </section>

             <section class="history-section">
    <h2>Historique des prix</h2>

    <label for="metal-select">Choisir un métal :</label>
    <select id="metal-select">
        <option value="xau">Or</option>
        <option value="silver">Argent</option>
    </select>

    <label for="history-period">Période :</label>
    <select id="history-period">
        <option value="7d">7 jours</option>
        <option value="1mo">30 jours</option>
    </select>

            <div id="history-chart">
            <p>Choisissez un métal et une période.</p>
            </div>
            </section>
            
            <button id="refresh-button">Actualiser les prix</button>
            <p id="status-message">Prêt</p>
        </main>

        <footer>© 2026 Mizan - Tous droits réservés</footer>

            <script src="js/main.js" type="module"></script>

    </body>
    </html>
