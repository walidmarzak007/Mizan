    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mizan</title>
    </head>
    <body>
        <header>
            <h1>Mizan</h1>
            <p>Suivez les prix de l'or et de l'argent en temps réel</p>
        </header>
        <main>
            <select id = "currency-select">
                <option value="MAD">MAD</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
            <section>
                <h2>Prix de l'or</h2>
                <p id = "gold-price">Chargement...</p>
            </section>
            <section>
                <h2>Prix de l'argent</h2>
                <p id = "silver-price">Chargement...</p>
            </section>
            <button id="refresh-button">Actualiser les prix</button>
            <p id="status-message">Prêt</p>
        </main>
        <footer>© 2026 Mizan - Tous droits réservés</footer>

    </body>
    </html>
